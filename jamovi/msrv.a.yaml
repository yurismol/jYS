---
name:  mSRV
title: Survival Analysis
menuGroup: jYS
menuSubgroup: Regression & Classification
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: elapsed
      title: Time Variable (elapsed time)
      type: Variable
      required: true
      suggested:
        - continuous
      permitted:
        - numeric

    - name: tstart
      title: Entry / Start Time (optional)
      type: Variable
      required: false
      suggested:
        - continuous
      permitted:
        - numeric

    - name: status
      title: Status / Event Variable
      type: Variable
      required: true
      suggested:
        - nominal
        - ordinal
        - continuous
      permitted:
        - factor
        - numeric

    - name: statusEvent
      title: Event level
      type: Level
      variable: (status)

    - name: subjectId
      title: Subject ID / Cluster (optional)
      type: Variable
      required: false
      suggested:
        - nominal
        - ordinal
        - id
      permitted:
        - factor
        - numeric
        - id

    - name: group
      title: Grouping Variable
      type: Variable
      required: false
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: covariates
      title: Covariates (Cox regression)
      type: Variables
      required: false
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: timeDepVars
      title: Time-varying Effects (Cox)
      type: Variables
      required: false
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: showKm
      title: Kaplan–Meier estimation
      type: Bool
      default: true

    - name: kmPlot
      title: Kaplan–Meier survival plot
      type: Bool
      default: true

    - name: kmCI
      title: Confidence intervals (KM)
      type: Bool
      default: true

    - name: kmTable
      title: Risk table
      type: Bool
      default: false

    - name: kmType
      title: Plot type
      type: List
      options:
        - title: Survival probability
          name: survival
        - title: Cumulative hazard
          name: hazard
      default: survival

    - name: kmMaxTime
      title: Max time (0 = unlimited)
      type: Number
      min: 0
      default: 0

    - name: showLogRank
      title: Log-rank test for group comparison
      type: Bool
      default: true

    - name: showCox
      title: Cox proportional hazards regression
      type: Bool
      default: true

    - name: coxFirth
      title: Firth's penalized likelihood
      type: Bool
      default: false

    - name: coxForest
      title: Forest plot of hazard ratios
      type: Bool
      default: false

    - name: coxAssump
      title: Test proportional hazards assumption
      type: Bool
      default: false

    - name: showSchoenfeldPlot
      title: Schoenfeld residuals plot
      type: Bool
      default: false

    - name: showAdjCurves
      title: Adjusted survival curves
      type: Bool
      default: false

    - name: adjExposure
      title: Exposure variable (adjusted curves)
      type: Variable
      required: false
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: adjCI
      title: Confidence intervals (bootstrap)
      type: Bool
      default: false

    - name: showTimeDepEffects
      title: Time-varying effects (time-varying coefficients)
      type: Bool
      default: false

    - name: timeDepFunc
      title: Time transform function
      type: List
      options:
        - title: log(t) (Logarithmic time)
          name: log
        - title: t (Linear time)
          name: linear
      default: log

    - name: showCompRisks
      title: Competing risks analysis
      type: Bool
      default: false

    - name: compEvent
      title: Event of interest
      type: Level
      variable: (status)

    - name: compCensor
      title: Censored level
      type: Level
      variable: (status)

    - name: showCifTable
      title: Cumulative incidence summary
      type: Bool
      default: true

    - name: showCifPlot
      title: Cumulative incidence curves (Aalen–Johansen)
      type: Bool
      default: true

    - name: cifCI
      title: Confidence intervals (CIF)
      type: Bool
      default: false

    - name: showGrayTest
      title: Gray's test for group differences
      type: Bool
      default: true

    - name: showFineGray
      title: Fine–Gray subdistribution hazard model
      type: Bool
      default: false

    - name: showRoc
      title: Time-dependent ROC analysis
      type: Bool
      default: false

    - name: rocPredictors
      title: Predictors (ROC)
      type: Variables
      required: false
      suggested:
        - continuous
      permitted:
        - numeric

    - name: rocTime
      title: Analysis time point t
      type: Number
      default: 12

    - name: rocCI
      title: Confidence intervals (ROC)
      type: Bool
      default: true

    - name: rocWidth
      title: Confidence level (%)
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: rocPlot
      title: ROC plot
      type: Bool
      default: false

    - name: palBrewer
      title: Qualitative Palette
      type: List
      options:
        - title: None
          name:  none
        - title: Accent
          name:  Accent
        - title: Dark2
          name:  Dark2
        - title: Paired
          name:  Paired
        - title: Pastel1
          name:  Pastel1
        - title: Set1
          name:  Set1
        - title: Set2
          name:  Set2
        - title: Set3
          name:  Set3
      default: Dark2
...
