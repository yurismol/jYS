---
name:  mSRV
title: Survival Analysis
menuGroup: jYS
menuSubgroup: Regression & Classification
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: elapsed
      title: Time Variable (elapsed time)
      type: Variable
      required: true
      suggested:
        - continuous
      permitted:
        - numeric

    - name: tstart
      title: Entry / Start Time (optional)
      type: Variable
      required: false
      suggested:
        - continuous
      permitted:
        - numeric

    - name: status
      title: Status / Event Variable
      type: Variable
      required: true
      suggested:
        - nominal
        - ordinal
        - continuous
      permitted:
        - factor
        - numeric

    - name: statusEvent
      title: Level
      type: Level
      variable: (status)

    - name: subjectId
      title: Subject ID / Cluster (optional)
      type: Variable
      required: false
      suggested:
        - nominal
        - ordinal
        - id
      permitted:
        - factor
        - numeric
        - id

    - name: group
      title: Grouping Variable
      type: Variable
      required: false
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: covariates
      title: Covariates (Cox regression)
      type: Variables
      required: false
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: timeDepVars
      title: Time-dependent Covariates
      type: Variables
      required: false
      suggested:
        - continuous
        - nominal
        - ordinal
      permitted:
        - numeric
        - factor

    - name: showKm
      title: Kaplan-Meier Survival Curves
      type: Bool
      default: true

    - name: kmPlot
      title: Kaplan-Meier Survival Plot
      type: Bool
      default: true

    - name: kmCI
      title: Confidence Intervals (KM)
      type: Bool
      default: true

    - name: kmTable
      title: Risk-at-time Table
      type: Bool
      default: false

    - name: kmType
      title: Plot Type
      type: List
      options:
        - title: Survival probability
          name: survival
        - title: Cumulative hazard
          name: hazard
      default: survival

    - name: kmMaxTime
      title: Max time (0 = unlimited)
      type: Number
      min: 0
      default: 0

    - name: showLogRank
      title: Log-rank Test for Group Comparison
      type: Bool
      default: true

    - name: showCox
      title: Cox Proportional Hazards Regression
      type: Bool
      default: true

    - name: coxForest
      title: Forest Plot of Hazard Ratios
      type: Bool
      default: false

    - name: coxAssump
      title: Test Proportional Hazards Assumption
      type: Bool
      default: false

    - name: showSchoenfeldPlot
      title: Schoenfeld Residuals Plot
      type: Bool
      default: false

    - name: showAdjCurves
      title: Show Adjusted Survival Curves
      type: Bool
      default: false

    - name: adjExposure
      title: Exposure Variable (Adjusted Curves)
      type: Variable
      required: false
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: adjCI
      title: Confidence Intervals (Bootstrap)
      type: Bool
      default: false

    - name: showTimeDepEffects
      title: Time-dependent effects (time-varying coefficients)
      type: Bool
      default: false

    - name: timeDepFunc
      title: Time Transform Function
      type: List
      options:
        - title: log(t) (Logarithmic time)
          name: log
        - title: t (Linear time)
          name: linear
      default: log

    - name: showCompRisks
      title: Competing Risks Analysis
      type: Bool
      default: false

    - name: compEvent
      title: Event of Interest
      type: Level
      variable: (status)

    - name: compCensor
      title: Censored Level
      type: Level
      variable: (status)

    - name: showCifTable
      title: Cumulative Incidence Summary
      type: Bool
      default: true

    - name: showCifPlot
      title: Cumulative Incidence Curves (Aalen-Johansen)
      type: Bool
      default: true

    - name: cifCI
      title: Confidence Intervals (CIF)
      type: Bool
      default: false

    - name: showGrayTest
      title: Gray's Test for Group Differences
      type: Bool
      default: true

    - name: showFineGray
      title: Fine-Gray Subdistribution Hazard Model
      type: Bool
      default: false

    - name: showRoc
      title: Time-dependent ROC Analysis
      type: Bool
      default: false

    - name: rocPredictors
      title: Predictors (ROC)
      type: Variables
      required: false
      suggested:
        - continuous
      permitted:
        - numeric

    - name: rocTime
      title: Analysis Time Point t
      type: Number
      default: 12

    - name: rocCI
      title: Confidence Interval (ROC)
      type: Bool
      default: true

    - name: rocWidth
      title: CI Width
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: rocPlot
      title: ROC Plot
      type: Bool
      default: false

    - name: palBrewer
      title: Qualitative Palette
      type: List
      options:
        - title: None
          name:  none
        - title: Accent
          name:  Accent
        - title: Dark2
          name:  Dark2
        - title: Paired
          name:  Paired
        - title: Pastel1
          name:  Pastel1
        - title: Set1
          name:  Set1
        - title: Set2
          name:  Set2
        - title: Set3
          name:  Set3
      default: Dark2
...
