---
name:  mSTAB
title: Stability Analysis (ICH Q1E)
jrs:   '1.1'
refs: [jys, ichq1e, chow2014, capen2018, quinlan2013, waterman2005, waterman2007, connors1986, zahn2006]

items:
    - name: instructions
      title: Instructions
      type: Html
      visible: true

    - name: poolTable
      title: ANCOVA Poolability Testing and Model Selection
      type: Table
      visible: (showPoolTable)
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
      columns:
          - name: step
            title: Test Step / Source
            type: text
          - name: df
            title: df
            type: integer
          - name: ss
            title: Sum of Squares
            type: number
          - name: ms
            title: Mean Square
            type: number
          - name: f
            title: F
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: decision
            title: Statistical Decision (ICH Q1E)
            type: text

    - name: shelfTable
      title: Shelf Life / Retest Period Estimation Summary
      type: Table
      visible: (showShelfTable)
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
          - accelCondition
          - studyDuration
      columns:
          - name: batch
            title: Batch / Cohort
            type: text
          - name: model
            title: Adopted Model
            type: text
          - name: intercept
            title: Intercept (t = 0)
            type: number
          - name: slope
            title: Slope (rate / month)
            type: number
          - name: statShelf
            title: Statistical Shelf Life (months)
            type: number
          - name: ichShelf
            title: ICH Q1E Permitted Shelf Life (months)
            type: number
          - name: limiting
            title: Status / Limiting Factor
            type: text

    - name: coefTable
      title: Regression Model Coefficients
      type: Table
      visible: (showCoefTable)
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
      columns:
          - name: term
            title: Parameter
            type: text
          - name: est
            title: Estimate
            type: number
          - name: se
            title: Std. Error
            type: number
          - name: t
            title: t
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: lower
            title: 95% CI Lower
            type: number
          - name: upper
            title: 95% CI Upper
            type: number

    - name: diagTable
      title: Model Diagnostics & Goodness of Fit
      type: Table
      visible: (showDiagTable)
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
      columns:
          - name: metric
            title: Diagnostic / Assumption Test
            type: text
          - name: value
            title: Statistic / Value
            type: number
          - name: df
            title: df / Parameter
            type: text
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: note
            title: Assessment / Criteria
            type: text

    - name: stabPlot
      title: Stability Plot with Confidence Bounds and Specification Limits
      type: Image
      visible: (showStabPlot)
      width:  680
      height: 480
      renderFun: .stabPlot
      requiresData: false
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
          - accelCondition
          - studyDuration

    - name: shelfPlot
      title: Shelf Life Comparison & ICH Q1E Extrapolation Horizon
      type: Image
      visible: (showShelfPlot)
      width:  660
      height: 400
      renderFun: .shelfPlot
      requiresData: false
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
          - accelCondition
          - studyDuration

    - name: facetPlot
      title: Individual Batch Trajectories (Faceted)
      type: Image
      visible: (showFacetPlot)
      width:  720
      height: 500
      renderFun: .facetPlot
      requiresData: false
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - trans
          - accelCondition
          - studyDuration

    - name: ratePlot
      title: Batch Degradation Rates & ANCOVA Slope Comparison
      type: Image
      visible: (showRatePlot)
      width:  660
      height: 380
      renderFun: .ratePlot
      requiresData: false
      clearWith:
          - dep
          - time
          - batch
          - modelChoice
          - trans
          - alphaPool

    - name: predPlot
      title: Individual Prediction Intervals & Release Limits (SRL)
      type: Image
      visible: (showPredPlot)
      width:  680
      height: 480
      renderFun: .predPlot
      requiresData: false
      clearWith:
          - dep
          - time
          - batch
          - specType
          - lsl
          - usl
          - alphaPool
          - confLevel
          - modelChoice
          - accelCondition
          - trans
          - studyDuration

    - name: diagPlot
      title: Residual Diagnostic Plots
      type: Image
      visible: (showDiagPlot)
      width:  700
      height: 600
      renderFun: .diagPlot
      requiresData: false
      clearWith:
          - dep
          - time
          - batch
          - modelChoice
          - alphaPool
          - trans

    - name: multiShelfTable
      title: Multi-Attribute Shelf Life Summary Table
      type: Table
      visible: (showMultiShelfTable && ((length(dep2) > 0 && dep2 != "") || (length(dep3) > 0 && dep3 != "") || (length(dep4) > 0 && dep4 != "") || (length(dep5) > 0 && dep5 != "")))
      columns:
          - name: attr
            title: Attribute / Parameter
            type: text
          - name: spec
            title: Acceptance Criteria
            type: text
          - name: model
            title: Adopted Model
            type: text
          - name: limitingBatch
            title: Governing Batch
            type: text
          - name: statShelf
            title: Statistical Shelf Life (months)
            type: number
          - name: ichShelf
            title: ICH Q1E Permitted Shelf Life (months)
            type: number
          - name: status
            title: Status / Limiting Role
            type: text

    - name: multiBatchTable
      title: Multi-Attribute Batch Evaluation Matrix
      type: Table
      visible: (showMultiBatchTable && ((length(dep2) > 0 && dep2 != "") || (length(dep3) > 0 && dep3 != "") || (length(dep4) > 0 && dep4 != "") || (length(dep5) > 0 && dep5 != "")))
      columns:
          - name: batch
            title: Batch / Cohort
            type: text
          - name: attr1
            title: Attribute 1 (months)
            type: number
          - name: attr2
            title: Attribute 2 (months)
            type: number
          - name: attr3
            title: Attribute 3 (months)
            type: number
          - name: attr4
            title: Attribute 4 (months)
            type: number
          - name: attr5
            title: Attribute 5 (months)
            type: number
          - name: worstShelf
            title: Batch Minimum Shelf Life (months)
            type: number
          - name: limitingAttr
            title: Limiting Attribute
            type: text

    - name: multiShelfPlot
      title: Multi-Attribute Shelf Life Comparison & Horizon Plot
      type: Image
      visible: (showMultiShelfPlot && ((length(dep2) > 0 && dep2 != "") || (length(dep3) > 0 && dep3 != "") || (length(dep4) > 0 && dep4 != "") || (length(dep5) > 0 && dep5 != "")))
      width:  700
      height: 420
      renderFun: .multiShelfPlot
      requiresData: false

    - name: arrhTable
      title: Arrhenius Accelerated Stability Recalculation Table
      type: Table
      visible: (showArrh)
      columns:
          - name: zone
            title: Storage Condition / Climatic Zone
            type: text
          - name: temp
            title: Temperature (°C)
            type: number
          - name: rh
            title: RH (%)
            type: number
          - name: af
            title: Acceleration Factor (AF)
            type: number
          - name: rate
            title: Degradation Rate (k / month)
            type: number
          - name: predShelf
            title: Predicted Shelf Life (months)
            type: number
          - name: extrapNote
            title: Projection & Regulatory Assessment
            type: text

    - name: arrhSensTable
      title: Activation Energy (Ea) Sensitivity Analysis Table
      type: Table
      visible: (showArrh && showArrhSens)
      columns:
          - name: ea
            title: Assumed Ea (kJ/mol)
            type: number
          - name: af
            title: Relative AF (vs 25°C)
            type: number
          - name: predShelf
            title: Predicted Shelf Life at 25°C (months)
            type: number
          - name: assessment
            title: Risk Profile / Assessment
            type: text

    - name: arrhRegTable
      title: Arrhenius Multi-Temperature Regression Model
      type: Table
      visible: (showArrh && (length(tempVar) > 0 && tempVar != ""))
      columns:
          - name: param
            title: Kinetic Parameter
            type: text
          - name: est
            title: Estimate
            type: number
          - name: se
            title: Std. Error
            type: number
          - name: t
            title: t
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: ci
            title: 95% Confidence Interval
            type: text

    - name: arrhPlot
      title: Arrhenius Degradation Kinetics Plot (ln(k) vs 1000/T)
      type: Image
      visible: (showArrh && showArrhPlot)
      width:  680
      height: 440
      renderFun: .arrhPlot
      requiresData: false

    - name: arrhTrajPlot
      title: Projected Degradation Trajectories Across Temperatures Plot
      type: Image
      visible: (showArrh && showArrhTrajPlot)
      width:  700
      height: 460
      renderFun: .arrhTrajPlot
      requiresData: false
...
