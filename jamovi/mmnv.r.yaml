---
name:  mMNV
title: MANOVA & Repeated Measures
jrs:   '1.1'
refs: [jys, obrien1985, fox2019, greenhouse1959, huynh1976, box1949, mardia1970, olson1974]

items:
    - name: instructions
      title: Instructions & Methodological Guidance
      type: Html
      visible: true

    - name: multivariateTable
      title: Multivariate Tests (MANOVA)
      type: Table
      visible: true
      refs: [obrien1985, fox2019, olson1974]
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
          - testPillai
          - testWilks
          - testHotelling
          - testRoy
      columns:
          - name: term
            title: Effect / Source
            type: text
            combineBelow: true
          - name: test
            title: Multiv. Test
            type: text
          - name: stat
            title: Value
            type: number
            format: zto
          - name: f
            title: F
            type: number
          - name: df1
            title: df1
            type: integer
          - name: df2
            title: df2
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: etaSqP
            title: Partial η²
            type: number
            format: zto

    - name: univariateTable
      title: Tests of Within-Subjects Effects (Univariate ANOVA)
      type: Table
      visible: (showUnivariate)
      refs: [greenhouse1959, huynh1976]
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
      columns:
          - name: term
            title: Effect / Source
            type: text
            combineBelow: true
          - name: correction
            title: Sphericity Correction
            type: text
          - name: ss
            title: Sum of Squares
            type: number
          - name: df1
            title: df1
            type: number
          - name: df2
            title: df2
            type: number
          - name: ms
            title: Mean Square
            type: number
          - name: f
            title: F
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: etaSqP
            title: Partial η²
            type: number
            format: zto

    - name: sphericityTable
      title: Mauchly's Sphericity Test & Epsilon Estimates
      type: Table
      visible: (showSphericity)
      refs: [obrien1985]
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
      columns:
          - name: term
            title: Within-Subjects Effect
            type: text
          - name: mauchlyW
            title: Mauchly's W
            type: number
            format: zto
          - name: chisq
            title: Approx. χ²
            type: number
          - name: df
            title: df
            type: integer
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: gg
            title: Greenhouse-Geisser ε
            type: number
            format: zto
          - name: hf
            title: Huynh-Feldt ε
            type: number
            format: zto
          - name: lower
            title: Lower Bound ε
            type: number
            format: zto

    - name: profileTable
      title: Profile Analysis Summary
      type: Table
      visible: (showProfileAnalysis)
      refs: [obrien1985]
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
      columns:
          - name: hypothesis
            title: Hypothesis / Question
            type: text
          - name: test
            title: Test Method
            type: text
          - name: stat
            title: Value
            type: number
            format: zto
          - name: f
            title: F
            type: number
          - name: df1
            title: df1
            type: integer
          - name: df2
            title: df2
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: conclusion
            title: Interpretation & Decision
            type: text

    - name: contrastsTable
      title: Tests of Within-Subjects Contrasts
      type: Table
      visible: (showContrastsTable)
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
          - contrastType
      columns:
          - name: contrast
            title: Contrast / Trend
            type: text
          - name: ss
            title: Sum of Squares
            type: number
          - name: df
            title: df
            type: integer
          - name: ms
            title: Mean Square
            type: number
          - name: f
            title: F
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: etaSqP
            title: Partial η²
            type: number
            format: zto

    - name: assumptionsTable
      title: Model Diagnostics & Assumption Checks
      type: Table
      visible: (showAssumptionChecks)
      refs: [box1949, mardia1970]
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
      columns:
          - name: test
            title: Diagnostic Test
            type: text
          - name: stat
            title: Statistic
            type: number
          - name: fOrChisq
            title: F / χ²
            type: number
          - name: df1
            title: df1
            type: number
          - name: df2
            title: df2
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: assessment
            title: Assessment & Recommendation
            type: text

    - name: meansTable
      title: Marginal Means & Descriptives
      type: Table
      visible: (showMeansTable)
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
      columns:
          - name: factor
            title: Group
            type: text
          - name: time
            title: Time / Condition
            type: text
          - name: n
            title: N
            type: integer
          - name: mean
            title: Mean
            type: number
          - name: se
            title: SE
            type: number
          - name: sd
            title: SD
            type: number
          - name: ciLower
            title: 95% CI Lower
            type: number
          - name: ciUpper
            title: 95% CI Upper
            type: number

    - name: profilePlot
      title: Trajectory / Profile Plot
      type: Image
      visible: (showProfilePlot)
      width: 650
      height: 450
      renderFun: .plotProfile
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
          - plotError

    - name: hePlot
      title: Group Scatter with Data Ellipses
      type: Image
      visible: (showHePlot)
      requiresData: true
      width: 550
      height: 450
      renderFun: .plotHe
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs

    - name: outlierPlot
      title: Multivariate Outliers (Mahalanobis Distance) Plot
      type: Image
      visible: (showOutlierPlot)
      width: 550
      height: 400
      renderFun: .plotOutlier
      clearWith:
          - rmCells
          - rmFactorName
          - between
          - covs
...
