title: Survival Analysis
name: mSRV
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Time Variable (elapsed time)
        children:
          - type: VariablesListBox
            name: elapsed
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Entry / Start Time (optional)
        children:
          - type: VariablesListBox
            name: tstart
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Status / Event Variable
        children:
          - type: VariablesListBox
            name: status
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: statusEvent
            label: Level
            enable: ({return ui['status'].value()!==null;})
      - type: TargetLayoutBox
        label: Subject ID / Cluster (optional)
        children:
          - type: VariablesListBox
            name: subjectId
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates (Adjustment / Confounders)
        children:
          - type: VariablesListBox
            name: covariates
            isTarget: true
            height: small
      - type: TargetLayoutBox
        label: Exposure Variable (Adjusted Curves)
        children:
          - type: VariablesListBox
            name: adjExposure
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Time-dependent Covariates (Cox)
        children:
          - type: VariablesListBox
            name: timeDepVars
            isTarget: true
            height: small

  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Predictors (ROC)
        children:
          - type: VariablesListBox
            name: rocPredictors
            isTarget: true
            height: small

  - type: CollapseBox
    label: Kaplan-Meier Curves & Estimation
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showKm
        children:
          - type: CheckBox
            name: kmPlot
            enable: (showKm)
            children:
              - type: CheckBox
                name: kmCI
                enable: (showKm && kmPlot)
              - type: ComboBox
                name: kmType
                enable: (showKm && kmPlot)
          - type: CheckBox
            name: kmTable
            enable: (showKm)
          - type: TextBox
            name: kmMaxTime
            label: Max time (0 = unlimited)
            format: number
            enable: (showKm)

  - type: CollapseBox
    label: Group Comparison
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showLogRank

  - type: CollapseBox
    label: Cox Proportional Hazards Regression
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showCox
        children:
          - type: CheckBox
            name: coxForest
            enable: (showCox)
          - type: CheckBox
            name: coxAssump
            enable: (showCox)
            children:
              - type: CheckBox
                name: showSchoenfeldPlot
                enable: (showCox && coxAssump)
          - type: CheckBox
            name: showTimeDepEffects
            enable: (showCox)
            children:
              - type: ComboBox
                name: timeDepFunc
                enable: (showCox && showTimeDepEffects)

  - type: CollapseBox
    label: Adjusted Survival Curves (Direct / G-computation)
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showAdjCurves
        children:
          - type: CheckBox
            name: adjCI
            enable: (showAdjCurves)

  - type: CollapseBox
    label: Competing Risks Analysis
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showCompRisks
        children:
          - type: LevelSelector
            name: compEvent
            label: Event of Interest
            enable: (showCompRisks && {return ui['status'].value()!==null;})
          - type: LevelSelector
            name: compCensor
            label: Censored Level
            enable: (showCompRisks && {return ui['status'].value()!==null;})
          - type: CheckBox
            name: showCifTable
            enable: (showCompRisks)
          - type: CheckBox
            name: showCifPlot
            enable: (showCompRisks)
            children:
              - type: CheckBox
                name: cifCI
                enable: (showCompRisks && showCifPlot)
          - type: CheckBox
            name: showGrayTest
            enable: (showCompRisks)
          - type: CheckBox
            name: showFineGray
            enable: (showCompRisks)

  - type: CollapseBox
    label: Time-dependent ROC Analysis
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showRoc
        children:
          - type: TextBox
            name: rocTime
            format: number
            enable: (showRoc)
          - type: CheckBox
            name: rocCI
            enable: (showRoc)
            children:
              - type: TextBox
                name: rocWidth
                label: Interval
                suffix: '%'
                format: number
                enable: (showRoc && rocCI)
          - type: CheckBox
            name: rocPlot
            enable: (showRoc)
            children:
              - type: ComboBox
                name: palBrewer
                enable: (showRoc && rocPlot)
