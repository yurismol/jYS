---
title: jYS Extended Functions
name: jYS
version: 1.1.5
jms: '1.0'
authors:
  - Yuri Smolyakov
maintainer: Yuri Smolyakov <smolyakov@rambler.ru>
date: '2026-09-20'
type: R
description: >
  Extensions of the functionality of popular data analysis methods: correlation
  clustering, ROC classification, missing values estimation and imputation,
  univariate and multivariate outliers identification and removal, Uncertain
  Interval (UI) threshold estimation, a priori power analysis, MLP neural
  network classifier, logistic regression with feature selection, Random Forest
  classifier, survival analysis (Kaplan-Meier, Cox regression, adjusted curves,
  competing risks, time-dependent effects), Principal Component Analysis (PCA),
  Single Nucleotide Polymorphism (SNP) association and Hardy-Weinberg
  equilibrium analysis, and Decision Curve Analysis (DCA) with model
  calibration.
datasets:
  - name: Correlation clustering
    path: COR_BLOOD.omv
    description: Correlation Clustering demonstration
  - name: SDI ROC classification
    path: ROC_SDI.omv
    description: Sperm Deformity Index ROC Classification demonstration
  - name: HI ROC classification
    path: ROC_HI.omv
    description: Healthy/Ill ROC Classification demonstration
  - name: BC ROC classification
    path: ROC_BLOOD.omv
    description: Blood cells multiple ROC Classification demonstration
  - name: BC Models ROC Estimation
    path: LOG_BLOOD.omv
    description: ROC estimation for binomial logistic models demonstration
  - name: CHD Models ROC Estimation
    path: LOG_CHD.omv
    description: ROC estimation for binomial logistic models demonstration
  - name: Missing Values Imputation
    path: MF_IRIS.omv
    description: Missing values imputation using the prediction power of Random Forests
  - name: Outliers identification and removal
    path: OUTL_IRIS.omv
    description: Identification, analysis and removal of data outliers by groups
  - name: Uncertain Interval (UI)
    path: UI_HI.omv
    description: Three-Way threshold determination in test results
  - name: UI for binomial logistic models
    path: UI_LOG.omv
    description: Uncertain Interval estimation for binomial logistic models
  - name: Neural Network Classification
    path: MLP.omv
    description: Neural Network Classifier (multilayer perceptron) demonstration
  - name: PCA blood cells
    path: PCA_BLOOD.omv
    description: Principal Component Analysis (PCA) demonstration
  - name: Logistic Regression blood cells
    path: LR_BLOOD.omv
    description: Logistic Regression demonstration
  - name: Survival Analysis Kaggle
    path: SRV_Kaggle.omv
    description: >-
      Survival Analysis (Kaplan-Meier, Cox regression, Adjusted Curves,
      Competing Risks, and Time-Dependent Effects) demonstration
  - name: SNP and HWE analysis
    path: SNP_CHD.omv
    description: SNP Association and Hardy-Weinberg Equilibrium analysis demonstration
  - name: Random Forest CHD classification
    path: RF_CHD.omv
    description: Coronary Heart Disease classification using Random Forest
  - name: Decision Curve Analysis CHD models
    path: DCA_CHD.omv
    description: >-
      Decision Curve Analysis (DCA) and Model Calibration for CHD prediction
      models demonstration
analyses:
  - title: Correlation clustering
    name: mCOR
    ns: jYS
    menuGroup: jYS
    menuSubgroup: Exploratory & Factor Analysis
    menuTitle: Correlation clustering
    ribbon: analyses
    category: analyses
  - title: Principal Component Analysis
    name: mPCA
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Exploratory & Factor Analysis
    menuTitle: Principal Component Analysis
    description: >-
      Principal Component Analysis (PCA). Note that parallel analysis and
      cross-validation use a random seed (default 42, configurable under PCA
      Configuration) for reproducibility.
  - title: Missing Values Estimation and Imputation
    name: mMF
    ns: jYS
    menuGroup: jYS
    menuSubgroup: Data Preprocessing
    menuTitle: Missing Values Estimation and Imputation
    ribbon: analyses
    category: analyses
  - title: Univariate outliers identification and removal
    name: mOUT
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Data Preprocessing
    menuTitle: Univariate outliers identification and removal
  - title: Multivariate outliers identification and removal
    name: mMOUT
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Data Preprocessing
    menuTitle: Multivariate outliers identification and removal
  - title: Logistic Regression
    name: mLR
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Regression & Classification
    menuTitle: Logistic Regression
    description: >-
      Logistic Regression with feature selection. Note that cross-validation
      fold partitioning uses a random seed (default 42, configurable under
      Validation Settings) for reproducibility.
  - title: Random Forest Classifier
    name: mRF
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Regression & Classification
    menuTitle: Random Forest Classifier
    description: >-
      Random Forest Classifier using the ranger package. Note that data
      partitioning uses a random seed (default 42, configurable under Validation
      Settings) for reproducibility.
  - title: MLP Classifier
    name: mMLP
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Regression & Classification
    menuTitle: MLP Classifier
    description: >-
      MLP Neural Network Classifier. Note that weight initialization and data
      partitioning use a random seed (default 42, configurable under Validation
      Settings) for reproducibility.
  - title: Survival Analysis
    name: mSRV
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Regression & Classification
    menuTitle: Survival Analysis
    description: >-
      Survival Analysis including Kaplan-Meier curves, log-rank tests, Cox
      proportional hazards regression, adjusted survival curves, competing risks
      analysis (Aalen-Johansen CIF, Gray's test, Fine-Gray model),
      time-dependent covariates, and time-dependent ROC curves.
  - title: ROC classification
    name: mROC
    ns: jYS
    menuGroup: jYS
    menuSubgroup: Regression & Classification
    menuTitle: ROC classification
    ribbon: analyses
    category: analyses
  - title: Decision Curve Analysis (DCA)
    name: mDCA
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Regression & Classification
    menuTitle: Decision Curve Analysis (DCA)
    description: >-
      Decision Curve Analysis (DCA) and Model Calibration. Evaluates clinical
      net benefit (Vickers et al., 2006) and interventions avoided for
      predictive models and biomarkers.
  - title: Uncertain Interval (UI)
    name: mUI
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Diagnostics & Genetics
    menuTitle: Uncertain Interval (UI)
  - title: Single Nucleotide Polymorphism
    name: mSNP
    ns: jYS
    category: analyses
    menuGroup: jYS
    menuSubgroup: Diagnostics & Genetics
    menuTitle: Single Nucleotide Polymorphism
    description: >-
      Analysis of genetic polymorphisms (SNP) including Hardy-Weinberg
