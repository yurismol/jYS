---
name:  mMNV
title: Repeated Measures & Profile Analysis
menuGroup: jYS
menuSubgroup: Classical & Advanced ANOVA
menuTitle: Repeated Measures & Profile Analysis
description:
    main: Repeated Measures MANOVA without sphericity assumption (O'Brien & Kaiser, 1985) and Profile Analysis.
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: rmCells
      title: Repeated Measures Cells (Within-Subjects)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: []

    - name: rmFactorName
      title: Within-Subjects Factor Name
      type: String
      default: Time

    - name: between
      title: Between-Subjects Factors
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: []

    - name: covs
      title: Covariates
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: []

    - name: testPillai
      title: Pillai's Trace
      type: Bool
      default: true

    - name: testWilks
      title: Wilks' Lambda
      type: Bool
      default: true

    - name: testHotelling
      title: Hotelling–Lawley Trace
      type: Bool
      default: true

    - name: testRoy
      title: Roy's Largest Root
      type: Bool
      default: true

    - name: contrastType
      title: Contrast Type
      type: List
      options:
        - title: Polynomial (Linear, Quadratic, etc.)
          name:  polynomial
        - title: Difference (Reverse Helmert)
          name:  difference
        - title: Helmert
          name:  helmert
        - title: Repeated (Successive differences)
          name:  repeated
        - title: Treatment (Compare to baseline)
          name:  treatment
      default: polynomial

    - name: showUnivariate
      title: Univariate Tests (Sphericity Corrections)
      type: Bool
      default: true

    - name: showSphericity
      title: Sphericity Tests & Epsilon Corrections
      type: Bool
      default: true

    - name: showProfileAnalysis
      title: Profile Analysis
      type: Bool
      default: true

    - name: showContrastsTable
      title: Within-Subjects Contrasts
      type: Bool
      default: true

    - name: showAssumptionChecks
      title: Assumption Checks
      type: Bool
      default: true

    - name: showMeansTable
      title: Descriptives
      type: Bool
      default: true

    - name: showProfilePlot
      title: Trajectory Plot
      type: Bool
      default: true

    - name: plotError
      title: Plot Error Bars
      type: List
      options:
        - title: 95% Confidence Interval
          name:  ci
        - title: Standard Error (SE)
          name:  se
        - title: None
          name:  none
      default: ci

    - name: showHePlot
      title: Scatter with Data Ellipses
      type: Bool
      default: false

    - name: showOutlierPlot
      title: Multivariate Outliers (Mahalanobis Distance)
      type: Bool
      default: false
...
