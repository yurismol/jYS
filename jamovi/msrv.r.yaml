---
name:  mSRV
title: Survival Analysis
jrs:   '1.1'

items:
  - name: kmSection
    title: Kaplan–Meier Survival Analysis
    type: Group
    visible: (showKm)
    refs: [jys, survival, ggsurvfit, kaplan1958]
    items:
      - name: kmSummaryTable
        title: Kaplan–Meier Survival Summary
        type: Table
        visible: (showKm)
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - subjectId
        columns:
          - name: group
            title: Group
            type: text
          - name: n
            title: N
            type: integer
          - name: events
            title: Events
            type: integer
          - name: median
            title: Median Survival
            type: number
          - name: lower
            title: Lower 95% CI
            type: number
          - name: upper
            title: Upper 95% CI
            type: number

      - name: kmRiskTable
        title: Kaplan–Meier Risk Table
        type: Table
        visible: (showKm && kmTable)
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - subjectId
          - kmMaxTime
        columns:
          - name: group
            title: Group
            type: text
          - name: time
            title: Time
            type: number
          - name: nAtRisk
            title: N at Risk
            type: integer
          - name: nEvent
            title: N Events
            type: integer

      - name: kmPlot
        title: Kaplan–Meier Curve
        type: Image
        width: 600
        height: 450
        renderFun: .kmPlot
        visible: (showKm && kmPlot)
        requiresData: false
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - subjectId
          - kmCI
          - kmTable
          - kmType
          - kmMaxTime

  - name: logRankTable
    title: Log-rank Test (Group Comparison)
    type: Table
    visible: (showLogRank && (!is.null(group)))
    refs: [survival]
    clearWith:
      - elapsed
      - tstart
      - status
      - statusEvent
      - group
      - subjectId
    columns:
      - name: chisq
        title: Chi-Square
        type: number
      - name: df
        title: df
        type: integer
      - name: p
        title: p
        type: number
        format: zto,pvalue

  - name: coxSection
    title: Cox Proportional Hazards Regression
    type: Group
    visible: (showCox && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group)) || showTimeDepEffects))
    refs: [survival, cox1972, harrell2015, therneau2000, firth1993, coxphf]
    items:
      - name: coxFitTable
        title: Cox Model Fit Statistics
        type: Table
        visible: (showCox && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - coxFirth
        columns:
          - name: test
            title: Test
            type: text
          - name: stat
            title: Statistic
            type: number
          - name: df
            title: df
            type: integer
          - name: p
            title: p
            type: number
            format: zto,pvalue

      - name: coxCoefTable
        title: Cox Regression Coefficients
        type: Table
        visible: (showCox && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - coxFirth
        columns:
          - name: var
            title: Variable
            type: text
          - name: coef
            title: Coefficient (Estimate)
            type: number
          - name: se
            title: SE
            type: number
          - name: z
            title: z
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: hr
            title: Hazard Ratio (HR)
            type: number
          - name: hrLower
            title: Lower 95% CI
            type: number
          - name: hrUpper
            title: Upper 95% CI
            type: number

      - name: timeDepTable
        title: Time-varying Effects in Cox Model
        type: Table
        visible: (showCox && showTimeDepEffects)
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - subjectId
          - group
          - covariates
          - timeDepVars
          - timeDepFunc
        columns:
          - name: var
            title: Variable / Term
            type: text
          - name: coef
            title: Coefficient (Estimate)
            type: number
          - name: se
            title: SE
            type: number
          - name: z
            title: z
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: hr
            title: Hazard Ratio (HR)
            type: number
          - name: hrLower
            title: Lower 95% CI
            type: number
          - name: hrUpper
            title: Upper 95% CI
            type: number

      - name: coxForestPlot
        title: Cox Hazard Ratios Forest Plot
        type: Image
        width: 500
        height: 400
        renderFun: .coxForestPlot
        visible: (showCox && coxForest && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - coxFirth

      - name: coxAssumpTable
        title: Proportional Hazards Assumption (Schoenfeld Residuals Test)
        type: Table
        visible: (showCox && coxAssump && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - coxFirth
        columns:
          - name: var
            title: Variable
            type: text
          - name: chisq
            title: Chi-Square
            type: number
          - name: df
            title: df
            type: integer
          - name: p
            title: p
            type: number
            format: zto,pvalue

      - name: schoenfeldPlots
        title: Schoenfeld Residuals Plots
        type: Array
        visible: (showCox && showSchoenfeldPlot && coxAssump && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - coxAssump
          - showSchoenfeldPlot
          - coxFirth
        template:
          title: $key
          type: Image
          width: 500
          height: 400
          renderFun: .schoenfeldPlot
          clearWith:
            - elapsed
            - tstart
            - status
            - statusEvent
            - group
            - covariates
            - subjectId
            - coxAssump
            - showSchoenfeldPlot
            - coxFirth

  - name: adjSection
    title: Adjusted Survival Curves (Direct / G-computation)
    type: Group
    visible: (showAdjCurves && ((!is.null(adjExposure)) || (!is.null(group))))
    refs: [survival, denz2023]
    items:
      - name: adjSummaryTable
        title: Adjusted Survival Summary
        type: Table
        visible: (showAdjCurves && ((!is.null(adjExposure)) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - adjExposure
          - kmMaxTime
        columns:
          - name: group
            title: Group
            type: text
          - name: n
            title: N
            type: integer
          - name: events
            title: Events
            type: integer
          - name: median
            title: Adjusted Median Survival
            type: number
          - name: rmst
            title: Adjusted RMST
            type: number

      - name: adjPlot
        title: Adjusted Survival Curves (Direct / G-computation)
        type: Image
        width: 600
        height: 450
        renderFun: .adjPlot
        visible: (showAdjCurves && ((!is.null(adjExposure)) || (!is.null(group))))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - group
          - covariates
          - subjectId
          - adjExposure
          - adjCI
          - kmMaxTime

  - name: compRisksSection
    title: Competing Risks Analysis
    type: Group
    visible: (showCompRisks)
    refs: [survival, aalen1978, gray1988, finegray1999]
    items:
      - name: cifSummaryTable
        title: Cumulative Incidence Summary
        type: Table
        visible: (showCompRisks && showCifTable)
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - compEvent
          - compCensor
          - group
          - subjectId
          - kmMaxTime
        columns:
          - name: group
            title: Group
            type: text
          - name: cause
            title: Cause / Event
            type: text
          - name: n
            title: N
            type: integer
          - name: events
            title: Events
            type: integer
          - name: cif
            title: Cumulative Incidence
            type: number
          - name: se
            title: SE
            type: number
          - name: lower
            title: Lower 95% CI
            type: number
          - name: upper
            title: Upper 95% CI
            type: number

      - name: cifPlot
        title: Cumulative Incidence Curves (Aalen–Johansen)
        type: Image
        width: 600
        height: 450
        renderFun: .cifPlot
        visible: (showCompRisks && showCifPlot)
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - compEvent
          - compCensor
          - group
          - subjectId
          - cifCI
          - kmMaxTime

      - name: grayTestTable
        title: Gray's Test for Group Differences
        type: Table
        visible: (showCompRisks && showGrayTest && (!is.null(group)))
        refs: [gray1988]
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - compEvent
          - compCensor
          - group
          - subjectId
        columns:
          - name: cause
            title: Cause / Event
            type: text
          - name: stat
            title: Chi-Square
            type: number
          - name: df
            title: df
            type: integer
          - name: p
            title: p
            type: number
            format: zto,pvalue

      - name: fineGrayTable
        title: Fine–Gray Subdistribution Hazard Regression
        type: Table
        visible: (showCompRisks && showFineGray && ((!is.null(covariates) && length(covariates) > 0) || (!is.null(group))))
        refs: [survival, finegray1999]
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - compEvent
          - compCensor
          - group
          - covariates
          - subjectId
        columns:
          - name: var
            title: Predictor
            type: text
          - name: coef
            title: Coefficient
            type: number
          - name: se
            title: Robust SE
            type: number
          - name: z
            title: z
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: shr
            title: Subdistribution HR (sHR)
            type: number
          - name: shrLower
            title: Lower 95% CI
            type: number
          - name: shrUpper
            title: Upper 95% CI
            type: number

  - name: rocSection
    title: Time-dependent ROC Analysis
    type: Group
    visible: (showRoc && (!is.null(rocPredictors) && length(rocPredictors) > 0))
    refs: [roc]
    items:
      - name: rocTable
        title: Time-dependent ROC Results
        type: Table
        visible: (showRoc && (!is.null(rocPredictors) && length(rocPredictors) > 0))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - subjectId
          - rocPredictors
          - rocTime
          - rocCI
          - rocWidth
        columns:
          - name: predictor
            title: Predictor
            type: text
          - name: time
            title: Time Point t
            type: number
          - name: auc
            title: AUC
            type: number
          - name: aucLower
            title: Lower CI
            type: number
            visible: (rocCI)
          - name: aucUpper
            title: Upper CI
            type: number
            visible: (rocCI)
          - name: cutoff
            title: Cut-off
            type: number
          - name: se
            title: Sensitivity
            type: number
          - name: sp
            title: Specificity
            type: number

      - name: rocPlot
        title: Time-dependent ROC Curves
        type: Image
        width: 500
        height: 500
        renderFun: .rocPlot
        visible: (showRoc && rocPlot && (!is.null(rocPredictors) && length(rocPredictors) > 0))
        clearWith:
          - elapsed
          - tstart
          - status
          - statusEvent
          - subjectId
          - rocPredictors
          - rocTime
          - rocCI
          - rocWidth
          - palBrewer
...
